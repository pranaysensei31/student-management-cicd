<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub | Edit Student</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/students">
            🎓 StudentHub
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="mb-4">
        <h1 class="fw-bold">Edit Student</h1>
        <p class="text-muted">
            Update student information.
        </p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <form method="POST">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ student['name'] }}"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Roll Number</label>
                        <input
                            type="text"
                            name="roll_no"
                            class="form-control"
                            value="{{ student['roll_no'] }}"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ student['email'] }}"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Department</label>

                        <select name="department" class="form-select" required>

                            <option value="CSE" {% if student['department'] == 'CSE' %}selected{% endif %}>CSE</option>
                            <option value="ECE" {% if student['department'] == 'ECE' %}selected{% endif %}>ECE</option>
                            <option value="IT" {% if student['department'] == 'IT' %}selected{% endif %}>IT</option>
                            <option value="ME" {% if student['department'] == 'ME' %}selected{% endif %}>ME</option>
                            <option value="CE" {% if student['department'] == 'CE' %}selected{% endif %}>CE</option>
                            <option value="AI & ML" {% if student['department'] == 'AI & ML' %}selected{% endif %}>AI & ML</option>

                        </select>

                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Year</label>

                        <select name="year" class="form-select" required>

                            <option value="1" {% if student['year'] == 1 %}selected{% endif %}>1st Year</option>
                            <option value="2" {% if student['year'] == 2 %}selected{% endif %}>2nd Year</option>
                            <option value="3" {% if student['year'] == 3 %}selected{% endif %}>3rd Year</option>
                            <option value="4" {% if student['year'] == 4 %}selected{% endif %}>4th Year</option>

                        </select>

                    </div>

                    <div class="col-md-6">
                        <label class="form-label">CGPA</label>

                        <input
                            type="number"
                            name="cgpa"
                            class="form-control"
                            value="{{ student['cgpa'] }}"
                            min="0"
                            max="10"
                            step="0.01"
                            required
                        >

                    </div>

                </div>

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary px-4"
                    >
                        Save Changes
                    </button>

                    <a
                        href="/students"
                        class="btn btn-outline-secondary ms-2"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>

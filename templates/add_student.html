<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub | Add Student</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f7fb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: linear-gradient(180deg, #111a36, #172554);
            color: white;
            padding: 28px 18px;
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 45px;
            padding-left: 12px;
        }

        .logo span {
            color: #635bff;
        }

        .nav-item-custom {
            display: block;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 10px;
            color: #d9def0;
            text-decoration: none;
            font-weight: 500;
        }

        .nav-item-custom:hover,
        .nav-item-custom.active {
            background: rgba(99, 91, 255, 0.3);
            color: white;
        }

        .main {
            margin-left: 260px;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            height: 74px;
            border-bottom: 1px solid #e6eaf0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 35px;
        }

        .content {
            padding: 38px;
            max-width: 1100px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: #18233d;
        }

        .subtitle {
            color: #718096;
        }

        .form-card {
            background: white;
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(31, 41, 55, 0.06);
            padding: 32px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #18233d;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            border: 1px solid #dfe5ee;
            border-radius: 10px;
            padding: 12px 14px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #635bff;
            box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.1);
        }

        .btn-primary-custom {
            background: #635bff;
            border: none;
            border-radius: 9px;
            padding: 12px 22px;
            color: white;
            font-weight: 600;
        }

        .btn-primary-custom:hover {
            background: #5148e8;
            color: white;
        }

        .btn-cancel {
            border: 1px solid #d8dee8;
            border-radius: 9px;
            padding: 11px 22px;
            color: #4b5563;
            background: white;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-cancel:hover {
            background: #f8fafc;
            color: #374151;
        }

        .info-box {
            background: #f5f3ff;
            border: 1px solid #e8e5ff;
            border-radius: 12px;
            padding: 15px;
            color: #5b54c7;
            font-size: 14px;
        }

    </style>

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        🎓 Student<span>Hub</span>
    </div>

    <a href="/" class="nav-item-custom">
        🏠 Dashboard
    </a>

    <a href="/students" class="nav-item-custom">
        👥 All Students
    </a>

    <a href="/add" class="nav-item-custom active">
        ➕ Add Student
    </a>

    <a href="/" class="nav-item-custom">
        📊 Analytics
    </a>

</div>


<!-- MAIN -->

<div class="main">


    <div class="topbar">

        <a
            href="/students"
            class="btn btn-outline-secondary"
        >
            ← Back to Students
        </a>

    </div>


    <div class="content">


        <div class="mb-4">

            <h1 class="page-title">
                Add Student
            </h1>

            <p class="subtitle">
                Add a new student to the management system
            </p>

        </div>


        <div class="form-card">


            <div class="mb-4">

                <div class="section-title">
                    Student Information
                </div>

                <p class="text-muted mb-0 mt-1">
                    Enter the student's academic and contact details.
                </p>

            </div>


            <div class="info-box mb-4">

                💡 Make sure the roll number and email are unique.

            </div>


            <form method="POST">


                <div class="row g-4">


                    <!-- NAME -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="e.g. Rahul Sharma"
                            required
                        >

                    </div>


                    <!-- ROLL -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Roll Number
                        </label>

                        <input
                            type="text"
                            name="roll_no"
                            class="form-control"
                            placeholder="e.g. CSE011"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="student@example.com"
                            required
                        >

                    </div>


                    <!-- DEPARTMENT -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Department
                        </label>

                        <select
                            name="department"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Department
                            </option>

                            <option>CSE</option>
                            <option>ECE</option>
                            <option>IT</option>
                            <option>ME</option>
                            <option>CE</option>
                            <option>AI & ML</option>

                        </select>

                    </div>


                    <!-- YEAR -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Academic Year
                        </label>

                        <select
                            name="year"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Year
                            </option>

                            <option value="1">
                                1st Year
                            </option>

                            <option value="2">
                                2nd Year
                            </option>

                            <option value="3">
                                3rd Year
                            </option>

                            <option value="4">
                                4th Year
                            </option>

                        </select>

                    </div>


                    <!-- CGPA -->

                    <div class="col-md-6">

                        <label class="form-label">
                            CGPA
                        </label>

                        <input
                            type="number"
                            name="cgpa"
                            class="form-control"
                            placeholder="e.g. 8.75"
                            min="0"
                            max="10"
                            step="0.01"
                            required
                        >

                    </div>


                </div>


                <hr class="my-4">


                <div class="d-flex gap-3">

                    <button
                        type="submit"
                        class="btn btn-primary-custom"
                    >
                        Add Student →
                    </button>

                    <a
                        href="/students"
                        class="btn-cancel"
                    >
                        Cancel
                    </a>

                </div>


            </form>


        </div>


    </div>


</div>


</body>

</html>
